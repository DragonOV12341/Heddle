[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heddle"
version = "0.1.0"
description = "Heddle: automated async pipeline scheduling for TileLang (AutoPiped + AutoMixed + Heddle)"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "ortools>=9.7",
]

[project.optional-dependencies]
frontend = ["torch>=2.4"]

[tool.setuptools.packages.find]
include = ["heddle*"]
